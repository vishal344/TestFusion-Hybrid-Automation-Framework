name: CPS Automation — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite'
        required: true
        default: 'testng.xml'
        type: choice
        options: [testng.xml, testng-smoke.xml]
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options: [chrome, firefox]
      tag:
        description: 'Cucumber tag'
        required: true
        default: '@RFQDetailsModule'
        type: choice
        options:
          - '@RFQDetailsModule'
          - '@Smoke'
          - '@Customer'
          - '@Employee'
          - '@ProcurementModule'

defaults:
  run:
    shell: cmd

jobs:
  selenium-tests:
    name: Run Selenium Tests
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show structure
        run: |
          echo === ROOT ===
          dir
          echo === cps-automation ===
          dir cps-automation

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: cps-automation
        run: mvn clean compile -q

      - name: Run Tests
        working-directory: cps-automation
        env:
          CI: true
        run: |
          mvn test ^
            -DsuiteFile=${{ github.event.inputs.suite || 'testng.xml' }} ^
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} ^
            "-Dcucumber.filter.tags=${{ github.event.inputs.tag || '@RFQDetailsModule' }}" ^
            -DbaseUrl="http://162.244.66.135:8989/rev-aux/buyerlogin" ^
            -DtestFailureIgnore=true

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_number }}
          path: |
            cps-automation/target/allure-results/
            cps-automation/target/cucumber-reports/
            cps-automation/target/screenshots/
            cps-automation/target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          files: cps-automation/target/surefire-reports/*.xml
          check_name: TestNG Results

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: cps-automation/target/allure-results
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Build Summary
        if: always()
        run: |
          echo ================================
          echo   RUN #${{ github.run_number }}
          echo   Branch : ${{ github.ref_name }}
          echo   Suite  : ${{ github.event.inputs.suite || 'testng.xml' }}
          echo   Report : https://vishal344.github.io/TestFusion-Hybrid-Automation-Framework
          echo ================================
