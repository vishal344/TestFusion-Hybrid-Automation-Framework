name: CPS Automation — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:

      - name: Step 1 - Checkout
        uses: actions/checkout@v4

      - name: Step 2 - Show structure
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== cps-automation ==="
          ls -la cps-automation/ || echo "MISSING cps-automation folder"
          echo "=== pom.xml ==="
          ls cps-automation/pom.xml || echo "MISSING pom.xml"
          echo "=== testng.xml ==="
          ls cps-automation/testng.xml || echo "MISSING testng.xml"

      - name: Step 3 - Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Step 4 - Install Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Step 5 - Maven compile
        working-directory: cps-automation
        run: mvn clean compile -q

      - name: Step 6 - Run Tests
        working-directory: cps-automation
        env:
          CI: true
        run: |
          mvn test \
            -DsuiteFile=testng.xml \
            -Dbrowser=chrome \
            -Dcucumber.filter.tags="@RFQDetailsModule" \
            -DbaseUrl="${{ secrets.APP_BASE_URL }}" \
            -q || true

      - name: Step 7 - Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_number }}
          path: |
            cps-automation/target/allure-results/
            cps-automation/target/cucumber-reports/
            cps-automation/target/screenshots/
            cps-automation/target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn
