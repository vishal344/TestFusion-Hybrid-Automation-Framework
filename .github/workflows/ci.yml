name: CPS Automation — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite'
        required: true
        default: 'testng.xml'
        type: choice
        options: [testng.xml, testng-smoke.xml]
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options: [chrome, firefox]
      tag:
        description: 'Cucumber tag'
        required: true
        default: '@RFQDetailsModule'
        type: choice
        options:
          - '@RFQDetailsModule'
          - '@Smoke'
          - '@Customer'
          - '@Employee'
          - '@ProcurementModule'

defaults:
  run:
    shell: cmd

jobs:
  selenium-tests:
    name: Run Selenium Tests
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Tools
        run: |
          java -version
          mvn -version

      - name: Compile
        working-directory: cps-automation
        run: mvn clean compile -q

      - name: Run Tests
        working-directory: cps-automation
        env:
          CI: true
        run: |
          mvn test ^
            -DsuiteFile=${{ github.event.inputs.suite || 'testng.xml' }} ^
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} ^
            "-Dcucumber.filter.tags=${{ github.event.inputs.tag || '@RFQDetailsModule' }}" ^
            -DbaseUrl="http://162.244.66.135:8989/rev-aux/buyerlogin" ^
            -DtestFailureIgnore=true

      - name: Show Report Files
        if: always()
        run: |
          echo === surefire-reports ===
          dir cps-automation\target\surefire-reports
          echo === cucumber-reports ===
          dir cps-automation\target\cucumber-reports

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_number }}
          path: |
            cps-automation/target/cucumber-reports/
            cps-automation/target/CucumberReports/
            cps-automation/target/surefire-reports/
            cps-automation/target/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results
          path: cps-automation/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Prepare Cucumber Report for Pages
        if: always()
        run: |
          if not exist report-site mkdir report-site
          copy cps-automation\target\cucumber-reports\cucumber.html report-site\index.html

      - name: Deploy Cucumber Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: report-site
          keep_files: false

      - name: Build Summary
        if: always()
        run: |
          echo ================================
          echo   RUN #${{ github.run_number }}
          echo   Branch : ${{ github.ref_name }}
          echo   Suite  : ${{ github.event.inputs.suite || 'testng.xml' }}
          echo   Browser: ${{ github.event.inputs.browser || 'chrome' }}
          echo   Tag    : ${{ github.event.inputs.tag || '@RFQDetailsModule' }}
          echo   Report : https://vishal344.github.io/TestFusion-Hybrid-Automation-Framework
          echo ================================
