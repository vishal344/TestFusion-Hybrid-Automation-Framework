name: CPS Automation — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite to run'
        required: true
        default: 'testng.xml'
        type: choice
        options:
          - testng.xml
          - testng-smoke.xml
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
      tag:
        description: 'Cucumber tag'
        required: true
        default: '@RFQDetailsModule'
        type: choice
        options:
          - '@RFQDetailsModule'
          - '@Smoke'
          - '@Customer'
          - '@Employee'
          - '@ProcurementModule'

jobs:
  selenium-tests:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:

      - name: ✅ Step 1 — Checkout code
        uses: actions/checkout@v4

      - name: ✅ Step 2 — Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: ✅ Step 3 — Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: ✅ Step 4 — Print versions
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Maven Version ==="
          mvn -version
          echo "=== Chrome Version ==="
          google-chrome --version
          echo "=== Project Structure ==="
          ls -la
          echo "=== cps-automation folder ==="
          ls -la cps-automation/

      - name: ✅ Step 5 — Build project
        working-directory: cps-automation
        run: mvn clean compile -q

      - name: ✅ Step 6 — Run Tests
        working-directory: cps-automation
        env:
          CI: true
          APP_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          mvn test \
            -DsuiteFile=${{ github.event.inputs.suite || 'testng.xml' }} \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dcucumber.filter.tags="${{ github.event.inputs.tag || '@RFQDetailsModule' }}" \
            -DbaseUrl="${{ secrets.APP_BASE_URL }}" \
            -DtestFailureIgnore=true \
            -q

      - name: ✅ Step 7 — Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: cps-automation/target/allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: ✅ Step 8 — Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: cps-automation/target/screenshots/
          retention-days: 7
          if-no-files-found: warn

      - name: ✅ Step 9 — Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ github.run_number }}
          path: cps-automation/target/cucumber-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: ✅ Step 10 — Publish TestNG Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: cps-automation/target/surefire-reports/*.xml
          check_name: TestNG Test Results
          comment_on_pr: true

      - name: ✅ Step 11 — Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: cps-automation/target/allure-results
          allure_report: allure-report
          allure_history: allure-history

      - name: ✅ Step 12 — Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: ✅ Step 13 — Show Results Summary
        if: always()
        run: |
          echo "=============================="
          echo "  BUILD SUMMARY"
          echo "=============================="
          echo "Run Number : ${{ github.run_number }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Suite      : ${{ github.event.inputs.suite || 'testng.xml' }}"
          echo "Browser    : ${{ github.event.inputs.browser || 'chrome' }}"
          echo "Tag        : ${{ github.event.inputs.tag || '@RFQDetailsModule' }}"
          echo "Report URL : https://vishal344.github.io/TestFusion-Hybrid-Automation-Framework"
          echo "=============================="
