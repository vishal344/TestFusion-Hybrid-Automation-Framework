name: CPS Automation — CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite'
        required: true
        default: 'testng.xml'
        type: choice
        options:
          - testng.xml
          - testng-smoke.xml

      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox

      tag:
        description: 'Cucumber tag'
        required: true
        default: '@RFQDetailsModule'
        type: choice
        options:
          - '@RFQDetailsModule'
          - '@Smoke'
          - '@Customer'
          - '@Employee'
          - '@ProcurementModule'

defaults:
  run:
    shell: cmd

jobs:
  selenium-tests:
    name: Run Selenium Tests
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Java & Maven
        run: |
          java -version
          mvn -version

      - name: Compile Project
        working-directory: cps-automation
        run: mvn clean compile -q

      - name: Execute Selenium Tests
        working-directory: cps-automation
        run: >
          mvn test
          "-DsuiteFile=${{ github.event.inputs.suite || 'testng.xml' }}"
          "-Dbrowser=${{ github.event.inputs.browser || 'chrome' }}"
          "-Dcucumber.filter.tags=${{ github.event.inputs.tag || '@RFQDetailsModule' }}"
          "-DbaseUrl=http://162.244.66.135:8989/rev-aux/buyerlogin"
          "-DtestFailureIgnore=true"
          "-DrfqId=NT79"

      - name: Show Generated Reports
        if: always()
        run: |
          echo === surefire-reports ===
          dir cps-automation\target\surefire-reports

          echo === cucumber-reports ===
          dir cps-automation\target\cucumber-reports

          echo === allure-results ===
          dir cps-automation\target\allure-results

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_number }}
          path: |
            cps-automation/target/cucumber-reports/
            cps-automation/target/surefire-reports/
            cps-automation/target/screenshots/
            cps-automation/target/allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Generate Allure Report
        if: always()
        working-directory: cps-automation
        run: >
          mvn allure:report
          "-Dallure.results.directory=target/allure-results"
          "-Dallure.report.directory=target/site/allure-maven-plugin"

      - name: Prepare Reports for GitHub Pages
        if: always()
        run: |
          if not exist report-site mkdir report-site
          if not exist report-site\cucumber mkdir report-site\cucumber
          if not exist report-site\allure mkdir report-site\allure

          if exist cps-automation\target\cucumber-reports\cucumber.html (
            copy cps-automation\target\cucumber-reports\cucumber.html report-site\cucumber\index.html
          )

          if exist cps-automation\target\site\allure-maven-plugin (
            xcopy /E /I /Y cps-automation\target\site\allure-maven-plugin report-site\allure
          )

          echo ^<html^>^<head^>^<title^>CPS Automation Reports^</title^>^</head^>^<body^> > report-site\index.html
          echo ^<h1^>CPS Automation Test Reports^</h1^> >> report-site\index.html
          echo ^<ul^> >> report-site\index.html
          echo ^<li^>^<a href="allure/index.html"^>Allure Report^</a^>^</li^> >> report-site\index.html
          echo ^<li^>^<a href="cucumber/index.html"^>Cucumber Report^</a^>^</li^> >> report-site\index.html
          echo ^</ul^>^</body^>^</html^> >> report-site\index.html

      - name: Deploy Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: report-site
          keep_files: false

      - name: Build Summary
        if: always()
        run: |
          echo ================================
          echo   RUN #${{ github.run_number }}
          echo   Branch : ${{ github.ref_name }}
          echo   Suite  : ${{ github.event.inputs.suite || 'testng.xml' }}
          echo   Browser: ${{ github.event.inputs.browser || 'chrome' }}
          echo   Tag    : ${{ github.event.inputs.tag || '@RFQDetailsModule' }}
          echo   Report : https://vishal344.github.io/TestFusion-Hybrid-Automation-Framework
          echo ================================
