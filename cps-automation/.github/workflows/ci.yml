name: CPS Automation — CI/CD Pipeline

# ── When does this pipeline run? ─────────────────────────────
on:
  push:
    branches: [ main ]          # every git push to main
  pull_request:
    branches: [ main ]          # every pull request to main
  schedule:
    - cron: '0 2 * * *'         # every night at 2 AM automatically
  workflow_dispatch:            # manual trigger button in GitHub UI
    inputs:
      suite:
        description: 'TestNG suite to run'
        required: true
        default: 'testng.xml'
        type: choice
        options:
          - testng.xml
          - testng-smoke.xml
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
      tag:
        description: 'Cucumber tag'
        required: true
        default: '@RFQDetailsModule'
        type: choice
        options:
          - '@RFQDetailsModule'
          - '@Smoke'
          - '@Customer'
          - '@Employee'
          - '@ProcurementModule'

# ── Job definition ────────────────────────────────────────────
jobs:
  selenium-tests:
    name: Run Selenium Tests
    runs-on: ubuntu-latest        # GitHub's free Linux server

    defaults:
      run:
        working-directory: cps-automation   # your subfolder

    steps:

      # ── Step 1: Get your code ─────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Install Java 17 (matches your pom.xml) ───
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven             # caches Maven deps = faster builds

      # ── Step 3: Install Chrome browser ───────────────────
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── Step 4: Show versions (good for debugging) ───────
      - name: Print versions
        run: |
          java -version
          mvn -version
          google-chrome --version

      # ── Step 5: Run your Selenium + Cucumber + TestNG ────
      - name: Run Tests
        run: |
          mvn test \
            -DsuiteFile=${{ github.event.inputs.suite || 'testng.xml' }} \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dcucumber.filter.tags="${{ github.event.inputs.tag || '@RFQDetailsModule' }}" \
            -DbaseUrl=${{ secrets.APP_BASE_URL }} \
            -q
        env:
          # Headless mode auto-detected by your DriverManager.java
          # because CI=true is set by GitHub automatically
          CI: true

      # ── Step 6: Upload Allure results (even if tests fail)
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: cps-automation/target/allure-results/
          retention-days: 30

      # ── Step 7: Upload screenshots on failure ────────────
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ github.run_number }}
          path: cps-automation/target/screenshots/
          retention-days: 7

      # ── Step 8: Upload Cucumber HTML report ──────────────
      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ github.run_number }}
          path: cps-automation/target/cucumber-reports/
          retention-days: 30

      # ── Step 9: Publish TestNG results in GitHub UI ──────
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: cps-automation/target/surefire-reports/*.xml
          check_name: TestNG Results
          comment_on_pr: true

      # ── Step 10: Generate Allure HTML Report ─────────────
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: cps-automation/target/allure-results
          allure_report: allure-report
          allure_history: allure-history

      # ── Step 11: Deploy Allure to GitHub Pages ───────────
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      # ── Step 12: Slack notification ──────────────────────
      - name: Slack — Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "channel": "#qa-automation",
              "attachments": [{
                "color": "good",
                "title": "✅ PASSED — CPS Automation",
                "fields": [
                  {"title": "Branch",  "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Run",     "value": "#${{ github.run_number }}", "short": true},
                  {"title": "Commit",  "value": "${{ github.sha }}", "short": false},
                  {"title": "Report",  "value": "https://vishal344.github.io/TestFusion-Hybrid-Automation-Framework", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Slack — Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "channel": "#qa-automation",
              "attachments": [{
                "color": "danger",
                "title": "❌ FAILED — CPS Automation",
                "fields": [
                  {"title": "Branch",  "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Run",     "value": "#${{ github.run_number }}", "short": true},
                  {"title": "Logs",    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK 